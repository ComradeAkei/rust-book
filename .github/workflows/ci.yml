# Проверки книги: всё, что глава утверждает о коде, должно воспроизводиться.
# Каждое задание повторяет команду, которую студент может запустить сам
# (см. README.md и приложение D).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# RUSTFLAGS здесь не задаётся намеренно: переменная окружения перекрывает
# target.*.rustflags из firmware/.cargo/config.toml, и прошивки потеряли бы
# -Tlink.x. Предупреждения запрещает clippy с -D warnings.
env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: fmt, clippy, тесты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Версия, компоненты и цели берутся из rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Глава 18 линкуется с zlib (crc32, compress); dev-символ libz.so даёт
      # zlib1g-dev. Ставим до clippy/теста, которые собирают крейты главы 18.
      # strace нужен тестам глав 15 и 28 и задаче 28.A: без него они
      # пропускаются. valgrind (cachegrind) и perf нужны опытам и задачам
      # главы 30 — ставим до `cargo test`.
      - run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev strace valgrind linux-tools-generic
      # Глава 30: /usr/bin/perf — обёртка, которая ищет perf для ядра
      # раннера и не находит; сам perf из linux-tools-generic с этим ядром
      # работает. Его и берём явно: в образе есть и perf 6.17 для ядер
      # azure, а `ls … | head` выбирал его — 6.17 в списке раньше 6.8.
      # Ubuntu по умолчанию не пускает пользователя к событиям
      # perf_event_open (kernel.perf_event_paranoid = 4). CH30_REQUIRE_*
      # превращают пропуск опыта без инструмента в ошибку.
      - name: perf и valgrind для главы 30
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=1
          perf=$(ls /usr/lib/linux-tools/*-generic/perf | head -n 1)
          "$perf" --version
          # Процессор раннера — для чисел тестов `observed_`.
          grep -m 1 'model name' /proc/cpuinfo
          {
            echo "PERF=$perf"
            echo "CH30_REQUIRE_PERF=1"
            echo "CH30_REQUIRE_PERF_EVENTS=1"
            echo "CH30_REQUIRE_VALGRIND=1"
          } >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check
        working-directory: firmware
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Корневой `cargo test` проверяет примеры глав и эталонные решения.
      # --no-fail-fast: упавший тест одного крейта не прячет остальные.
      - run: cargo test --no-fail-fast
      # Глава 30: опыты под perf — ещё раз с каждым другим perf образа.
      # perf 6.17 для ядер azure собран без libunwind (стек по DWARF
      # раскручивает libdw) и сам разбирает имена v0: на нём тесты
      # проверяют оба случая из раздела 30.3.
      - name: Глава 30 с другими perf образа
        run: |
          n=0
          for p in /usr/lib/linux-tools/*/perf; do
            [ "$p" = "$PERF" ] && continue
            "$p" --version || continue
            PERF="$p" cargo test -p ch30 --test perf
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
            echo "::warning::других perf в образе нет: путь libdw не проверен"
          fi
      # Часть поведения в приложении A зависит от профиля сборки.
      - run: cargo test -p appendix-a --release
      # C-примеры приложения A под UBSan: gcc с libubsan есть в образе.
      - run: bash code/appendix-a/c/run.sh
      # C-примеры глав 1 и 2 и задача 1.A на C: вывод программ и
      # предупреждения GCC и clang (clang 18 есть в образе). Части для
      # Cortex-M здесь пропускаются, их проверяет задание thumb.
      - run: bash code/ch01/c/run.sh
      - run: bash code/ch02/c/run.sh
      - run: bash solutions/ch01/c/run.sh
      # C-примеры из введений к главам 3–5 и раздела 4.5: ASan, UBSan и
      # анализаторы GCC и clang. Часть главы 4 с arm-none-eabi-gcc здесь
      # пропускается, её проверяет задание thumb.
      - run: bash code/ch03/c/run.sh
      - run: bash code/ch04/c/run.sh
      - run: bash code/ch05/c/run.sh
      # C-примеры главы 7: errno, забытая проверка кода возврата и longjmp
      # мимо очистки (анализаторы GCC и clang, LeakSanitizer).
      - run: bash code/ch07/c/run.sh
      # C-примеры главы 8: #ifdef с опечаткой и столкновение глобальных
      # имён при компоновке двух файлов.
      - run: bash code/ch08/c/run.sh
      # C-пример главы 9: таблица указателей на функции вместо трейта, где
      # забытый указатель компиляторы пропускают, а программа падает.
      - run: bash code/ch09/c/run.sh
      # C-пример главы 10: qsort с компаратором через указатель против
      # сортировки, размноженной макросом.
      - run: bash code/ch10/c/run.sh
      # C-пример главы 11: struct file_operations, указатель на таблицу в
      # каждом объекте, промахи предсказателя по модели valgrind и вызов
      # через переходник retpoline.
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: bash code/ch11/c/run.sh
      # C-пример главы 12: обработчик с void *ctx, чужой контекст и контекст
      # на мёртвом стеке под ASan, вызов через указатель против своей копии.
      - run: bash code/ch12/c/run.sh
      # C-пример главы 13: циклы по индексам с ошибками на единицу и на
      # знак, которые видит только ASan, и одна, которую не видит никто.
      - run: bash code/ch13/c/run.sh
      # C-примеры главы 14: счётчик ссылок вручную с утечкой, двойным put,
      # подпиской во время обхода и гонкой (ASan, LeakSanitizer, TSan,
      # анализаторы GCC и clang), повторное чтение через const int *.
      - run: bash code/ch14/c/run.sh
      # C-пример главы 15: самодельная хеш-таблица с открытой адресацией и
      # хешем K&R — висячий указатель на ячейку после роста (ASan), сосед с
      # общим хешем теряется после удаления, вырождение на подобранных
      # именах; что видят и чего не видят -fanalyzer и clang --analyze.
      - run: bash code/ch15/c/run.sh
      # Глава 18, обратная сторона FFI: C линкуется со статической библиотекой
      # Rust и вызывает её. code/ch18 — непрозрачный счётчик (раздел 18.4),
      # solutions/ch18 — кольцевой буфер (задача C). Оба под ASan/LeakSanitizer.
      - run: bash code/ch18/c/run.sh
      - run: bash solutions/ch18/c/run.sh
      # C-пример главы 23: SQUARE без скобок, MAX с двойным вычислением,
      # SWAP с захватом имени tmp и LOG2 под if; X-macro. Что из этого видят
      # GCC -Wall, -Wshadow и clang.
      - run: bash code/ch23/c/run.sh
      # C-примеры главы 25: `const int` в размере массива (C17), constexpr
      # из C23 без функций, делитель UART препроцессором и #error. Нужен
      # gcc 13 — он в образе ubuntu-24.04.
      - run: bash code/ch25/c/run.sh
      # C-пример главы 28: копия файла с errno и goto. Утечку дескриптора
      # на пути ошибки GCC -Wall и clang --analyze не видят, -fanalyzer —
      # только без оптимизации, valgrind --track-fds=yes — всегда.
      - run: bash code/ch28/c/run.sh
      # Раздел 30.5: PGO программы главы 30. llvm-profdata той же версии
      # LLVM, что у rustc, даёт компонент llvm-tools.
      - run: rustup component add llvm-tools && bash code/ch30/pgo/run.sh
      # Заготовки студента не проходят тесты, пока задачи не решены,
      # но обязаны собираться.
      - run: |
          cargo build -p ch00-exercises -p ch01-exercises -p ch02-exercises \
            -p ch02-exercises-2021 -p ch03-exercises -p ch04-exercises \
            -p ch05-exercises -p ch06-exercises -p ch07-exercises -p ch08-exercises \
            -p ch09-exercises -p ch10-exercises -p ch11-exercises -p ch12-exercises \
            -p ch13-exercises -p ch14-exercises -p ch15-exercises -p ch16-exercises \
            -p ch17-exercises -p ch18-exercises -p ch19-exercises -p ch20-exercises \
            -p ch21-exercises -p ch22-exercises -p ch23-exercises -p ch24-exercises \
            -p ch25-exercises -p ch26-exercises -p ch27-exercises -p ch28-exercises \
            -p ch29-exercises -p ch30-exercises -p ch31-exercises -p project-frame \
            -p project-store --all-targets
      # Вложенные рабочие пространства глав 7, 8, 24, 26 и 31 корневой cargo
      # не видит: их собирают тесты и скрипты, а формат и clippy проверяются
      # здесь. Цели фаззинга главы 31 clippy проверяет и без nightly: сборки
      # с инструментированием для этого не нужно. В typo
      # предупреждения о cfg — предмет опыта, в заготовке d-station ошибка
      # сборки — условие задачи 8.D, поэтому clippy их не проверяет. В
      # code/ch24/renamed ошибка сборки — под feature broken, которую clippy
      # не включает.
      - name: fmt и clippy вложенных рабочих пространств
        run: |
          for ws in code/ch07/c-size code/ch08/typo code/ch08/unify code/ch08/ffi \
              exercises/ch08/c/station solutions/ch08/c/station \
              exercises/ch08/d-station solutions/ch08/d-station code/ch24/renamed \
              code/ch26/start solutions/ch26/tiny exercises/ch26/tiny \
              code/ch31/fuzz exercises/ch31/fuzz solutions/ch31/fuzz \
              code/ch31/supply/build/app code/ch31/supply/vet; do
            cargo fmt --all --check --manifest-path "$ws/Cargo.toml"
          done
          for ws in code/ch07/c-size code/ch08/unify code/ch08/ffi \
              exercises/ch08/c/station solutions/ch08/c/station solutions/ch08/d-station \
              code/ch24/renamed code/ch26/start solutions/ch26/tiny exercises/ch26/tiny \
              code/ch31/fuzz exercises/ch31/fuzz solutions/ch31/fuzz \
              code/ch31/supply/build/app code/ch31/supply/vet; do
            cargo clippy --manifest-path "$ws/Cargo.toml" --all-targets -- -D warnings
          done

  miri:
    name: Miri
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly miri setup
      # Тесты, которые запускают cargo, компилятор или внешние программы,
      # под Miri помечены ignore.
      - run: |
          cargo +nightly miri test -p ch00 -p ch01 -p ch02 -p ch00-solutions \
            -p ch01-solutions -p ch02-solutions -p ch02-solutions-2021
      - run: |
          cargo +nightly miri test -p ch03 -p ch04 -p ch05 -p ch03-solutions \
            -p ch04-solutions -p ch05-solutions
      # Главы 3–5 разбирают алиасинг ссылок, поэтому их код проходит и
      # вторую модель Miri.
      - run: |
          cargo +nightly miri test -p ch03 -p ch04 -p ch05 -p ch03-solutions \
            -p ch04-solutions -p ch05-solutions
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
      - run: cargo +nightly miri test -p ch06 -p ch06-regs -p ch06-solutions -p telemetry-frame
      # Глава 7: раскрутка через деструкторы, catch_unwind и буфер задачи
      # 7.D проходят обе модели алиасинга.
      - run: cargo +nightly miri test -p ch07 -p ch07-solutions
      - run: cargo +nightly miri test -p ch07 -p ch07-solutions
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
      # Глава 8: таблица датчиков из build.rs, видимость и задачи без
      # запуска cargo и компилятора.
      - run: cargo +nightly miri test -p ch08 -p ch08-solutions
      # Глава 9: трейты, маркеры и драйверы задач 9.B и 9.D на моделях шин.
      - run: cargo +nightly miri test -p ch09 -p ch09-solutions
      # Глава 10: обобщения, typestate на модели PL011, матрицы и драйвер
      # SPI-flash задачи 10.D на модели W25Q. qsort из libc Miri не
      # исполняет, эти тесты помечены ignore.
      - run: cargo +nightly miri test -p ch10 -p ch10-solutions
      # Глава 11: объекты трейтов, таблица задачи 11.B и её деструкторы.
      # Чтение таблицы методов в задаче 11.D Miri отвергает, этот тест
      # помечен ignore.
      - run: cargo +nightly miri test -p ch11 -p ch11-solutions
      # Глава 12: замыкания, реестры задачи 12.B и потоки задачи 12.D.
      # qsort_r из glibc Miri не исполняет, эти тесты помечены ignore.
      - run: cargo +nightly miri test -p ch12 -p ch12-solutions
      # Глава 13: итераторы, кольцевой буфер и задачи с распределителем-
      # счётчиком. Решето у границы u32 под Miri строится минутами, эти
      # тесты помечены ignore.
      - run: cargo +nightly miri test -p ch13 -p ch13-solutions
      # Глава 14: Box, Rc, Arc, ячейки и задачи со своим Rc и списками.
      # Свой Rc обязан проходить обе модели алиасинга. UB из ub.rs и
      # ub_rc.rs помечены ignore и запускаются по одному вручную.
      - run: cargo +nightly miri test -p ch14 -p ch14-solutions
      - run: cargo +nightly miri test -p ch14 -p ch14-solutions
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
      # Глава 15: коллекции, распределитель-счётчик (задача B), bump-арена
      # (задача C) и своя таблица (задача D). Арена и распределители требуют
      # обеих моделей алиасинга. Опыты, запускающие cargo и strace, помечены
      # ignore. Тесты задачи B — отдельный бинарник со своим global_allocator.
      - run: |
          cargo +nightly miri test -p ch15 -p ch15-solutions
          cargo +nightly miri test -p ch15-solutions --test ch15-count
      - run: |
          cargo +nightly miri test -p ch15 -p ch15-solutions
          cargo +nightly miri test -p ch15-solutions --test ch15-count
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
      # Глава 16: пять возможностей unsafe, инварианты, provenance и решения
      # (split_first_mut задачи B через сырые указатели обязан проходить обе
      # модели). Каталог UB (A), висячая ссылка из unsound-API (C) и
      # расхождение SB/TB (D) помечены ignore и проверяются отдельным
      # скриптом. Тесты asm запускают cargo — под Miri они ignore.
      - run: cargo +nightly miri test -p ch16 -p ch16-solutions
      - run: cargo +nightly miri test -p ch16 -p ch16-solutions
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
      - name: Каталог UB главы 16 и расхождение моделей алиасинга
        run: bash code/ch16/ub/run.sh
      # Глава 17: MaybeUninit, операции с указателями, volatile, NonNull,
      # transmute и типы динамического размера. Ручное выделение DST
      # (задача D) и решения обязаны проходить обе модели. Каталог transmute
      # (задача A) — отдельным скриптом.
      - run: cargo +nightly miri test -p ch17 -p ch17-solutions
      - run: cargo +nightly miri test -p ch17 -p ch17-solutions
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
      # Строгий provenance: тегированные указатели глав 16 и 17 не
      # восстанавливают право на память из голого числа.
      - run: cargo +nightly miri test -p ch16 -p ch17 -p ch17-solutions
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
      - name: Каталог transmute главы 17
        run: bash code/ch17/ub/run.sh
      # Глава 20: безопасность от гонок данных в безопасном коде — свойство
      # типов (Send/Sync), её проверяет компилятор; тяжёлые потоковые тесты
      # под Miri непрактичны и проверяются заданием host. Под Miri гоняем
      # unsafe-обёртки (Shared, SendBox) на отсутствие UB, гонок и утечек;
      # задача C (futex через syscall) — ignore.
      - run: cargo +nightly miri test -p ch20 -p ch20-solutions -- shared_pointer a_sendbox
      # Глава 21: Miri ловит гонки данных и эмулирует слабую память, так что
      # слишком слабый порядок в unsafe-коде он находит — но зависит от
      # чередования, поэтому малые многопоточные тесты гоняем на нескольких
      # зёрнах. Миллионные прогоны и пробы перестановок под Miri непрактичны
      # (проверяет host). Однопоточный SPSC сверяет работу с
      # UnsafeCell<MaybeUninit<T>> (нет чтения неинициализированного, нет
      # нарушения алиасинга); малый двухпоточный SPSC и малый стек Трайбера
      # (задача D) — публикацию через Release/Acquire и отсутствие гонок.
      - run: cargo +nightly miri test -p ch21 -- single_thread_fifo producer_consumer_small
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..8
      - run: cargo +nightly miri test -p ch21-solutions -- d_treiber_small
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..8
      # Глава 22: автоматы async, Pin, исполнители, RawWaker без кучи и
      # таймеры — всё однопоточное и под Miri проходит целиком, в обеих
      # моделях алиасинга (самоссылки и get_unchecked_mut — их предмет).
      # Задача C (epoll через syscall и сеть) помечена ignore.
      - run: cargo +nightly miri test -p ch22 -p ch22-solutions
      - run: cargo +nightly miri test -p ch22 -p ch22-solutions
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
      # Глава 23: код из макросов — обычный код: регистры периферии на
      # памяти теста (volatile через указатель с provenance), static mut
      # через &raw mut в take_once!. Тесты, которые запускают rustc и
      # cargo (раскрытие, кодогенерация), помечены ignore.
      - run: cargo +nightly miri test -p ch23 -p ch23-solutions
      - run: cargo +nightly miri test -p ch23 -p ch23-solutions
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
      # Глава 24: код из процедурных макросов — обычный код: Describe с
      # offset_of!, обработчик #[interrupt] со static mut через &raw mut,
      # Bitfield, Timing на атомиках и регистры из SVD на памяти теста. Сами
      # макросы исполняет компилятор, а не Miri: крейты proc-macro здесь не
      # тестируются, а тесты, которые запускают cargo и trybuild, — ignore.
      - run: cargo +nightly miri test -p ch24 -p ch24-solutions
      - run: cargo +nightly miri test -p ch24 -p ch24-solutions
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
      # Глава 25: static mut через &raw mut, атомики, compare_exchange из
      # восьми потоков, Mutex и LazyLock в static. Наблюдение об общих
      # адресах копий константы под Miri неверно — тест помечен ignore, как
      # и тесты, которые запускают rustc и cargo.
      - run: cargo +nightly miri test -p ch25 -p ch25-solutions
      - run: cargo +nightly miri test -p ch25 -p ch25-solutions
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
      # Глава 26: Cursor поверх среза в fmt::Write, функции раздела 26.5 и
      # свои memcpy, memmove и memset из задачи D на всех выравниваниях и
      # перекрытиях. Системные вызовы через asm! Miri не выполняет — эти
      # тесты помечены ignore, как и тесты, которые запускают rustc и cargo.
      - run: cargo +nightly miri test -p ch26 -p ch26-solutions
      - run: cargo +nightly miri test -p ch26 -p ch26-solutions
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
      # Глава 27: EXC_RETURN, приоритеты, bit-band, регистры MPU, драйвер
      # 74HC595 на модели выводов, адреса и делители HAL, редактор строки,
      # кадр стека задачи и разбор CFSR. Тесты, которые запускают cargo,
      # rustc и QEMU, помечены ignore.
      - run: cargo +nightly miri test -p ch27 -p ch27-hal -p ch27-solutions
      - run: cargo +nightly miri test -p ch27 -p ch27-hal -p ch27-solutions
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
      - run: cargo +nightly miri test -p appendix-a -p appendix-b -p appendix-b-2021 -p appendix-c
      # Чек-лист приложения C требует проходить Miri в обеих моделях алиасинга.
      - run: cargo +nightly miri test -p appendix-c
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
      # Коды ошибок в doc-тестах compile_fail,EXXXX rustdoc сверяет только на
      # nightly, stable проверяет лишь то, что пример не компилируется.
      - run: |
          cargo +nightly test --doc -p ch00 -p ch01 -p ch02 -p ch06 -p ch07 -p ch08 -p ch09 \
            -p ch10 -p ch11 -p ch12 -p ch13 -p ch14 -p ch15 -p ch16 -p ch17 -p ch17-solutions \
            -p ch18 -p ch19 -p ch20 -p ch22 -p ch23 -p ch23-solutions -p ch24 -p ch25 \
            -p appendix-a -p appendix-b -p appendix-b-2021 -p appendix-c
      # Глава 11: DynMetadata и -Zretpoline есть только в nightly.
      - run: cargo +nightly test -p ch11 --features nightly --test nightly
      # Глава 12: ручная реализация Fn через unboxed_closures и fn_traits.
      - run: cargo +nightly test -p ch12 --features nightly --test nightly
      # Глава 19: переносимый SIMD (core::simd) собирается только на nightly
      # под feature="nightly". Интеграционный тест asm запускает свой cargo,
      # поэтому здесь только --lib.
      - run: cargo +nightly test -p ch19 --features nightly --lib
      - run: |
          cargo +nightly test --doc -p ch03 -p ch04 -p ch05 -p ch03-solutions \
            -p ch04-solutions -p ch05-solutions

  layout:
    name: Случайная раскладка полей
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        seed: [1, 2, 3]
    env:
      RUSTFLAGS: -Zrandomize-layout -Zlayout-seed=${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      # clippy нужен тесту clippy_finds_all_three из code/ch00: он вызывает
      # `cargo clippy` тем же cargo, что и сам, то есть nightly.
      - run: rustup toolchain install nightly --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: layout-${{ matrix.seed }}
      # Решения и проект не должны зависеть от раскладки repr(Rust).
      # p12_inlined собирает крейт проекта закреплённым cargo и читает его
      # ассемблер: к раскладке это не относится, тест проверяет задание host.
      - run: cargo +nightly test -p ch06-solutions -p telemetry-frame -p ch06-regs -- --skip p12_inlined
      - run: cargo +nightly test -p ch00-solutions -p ch01-solutions
      # Задача 2.A сверяет ответы с ассемблером, а LLVM у nightly другой, чем
      # у закреплённого rustc (приложение E): к раскладке это не относится.
      - run: cargo +nightly test -p ch02-solutions -p ch02-solutions-2021 -- --skip task_a
      # Примеры глав 0–2 не проверяют раскладку repr(Rust) и проходят целиком.
      - run: cargo +nightly test -p ch00 -p ch01 -p ch02
      # Главы 3–5. Тесты, которые запускают закреплённый rustc (Polonius,
      # задачи 4.A и 4.B) или сверяют ассемблер nightly с ответом для
      # rustc 1.97 (задача 3.C), к раскладке не относятся и требуют
      # тулчейнов, которых в этом задании нет. Их проверяет задание host.
      - run: cargo +nightly test -p ch03 -p ch04 -p ch05 -p ch05-solutions -- --skip polonius
      - run: cargo +nightly test -p ch03-solutions -- --skip task_c
      - run: cargo +nightly test -p ch04-solutions -- --skip polonius --skip task_a --skip task_b
      # Тесты группы `observed` фиксируют поведение текущего rustc и под
      # случайной раскладкой обязаны падать (раздел 6.2), поэтому их пропускаем.
      - run: cargo +nightly test -p ch06 -- --skip observed
      # Глава 7: задача 7.A собирает фрагменты закреплённым rustc, 7.C —
      # программу закреплённым cargo; `observed_sizes` фиксирует размеры
      # repr(Rust) у текущего rustc.
      - run: |
          cargo +nightly test -p ch07 -p ch07-solutions -- \
            --skip task_a --skip task_c --skip observed
      # Глава 8: опыты `cargo_` и задачи 8.A, 8.B (сборка под Cortex-M),
      # 8.C (make) и 8.D запускают закреплённые rustc и cargo.
      - run: |
          cargo +nightly test -p ch08 -p ch08-solutions -- \
            --skip cargo_ --skip task_a --skip task_b_flash --skip task_c_from_c --skip task_d
      # Глава 9: раскрытие derive и пробы задач 9.A, 9.B и 9.C собирает
      # закреплённый rustc, а 9.B ещё и cargo под Cortex-M0.
      - run: |
          cargo +nightly test -p ch09 -p ch09-solutions -- --skip rustc_ \
            --skip task_a --skip task_b_access --skip task_b_thumb --skip task_c_sealed
      # Глава 10: замеры кода `rustc_` и задачи 10.A, 10.B (сборка для
      # хоста), 10.C и 10.D (пробы и сборка под Cortex-M4F) запускают
      # закреплённые rustc и cargo.
      - run: |
          cargo +nightly test -p ch10 -p ch10-solutions -- --skip rustc_ --skip task_a \
            --skip task_b_inlined --skip task_c_types --skip task_c_sizes --skip task_d_types
      # Глава 11: ассемблер `rustc_`, проба 11.A для Cortex-M3 и ассемблер
      # задач 11.B и 11.C собираются закреплённым cargo.
      - run: |
          cargo +nightly test -p ch11 -p ch11-solutions -- --skip rustc_ --skip task_a_thumb \
            --skip task_b_same_code --skip task_c_calls
      # Глава 12: ассемблер `rustc_`, проба 12.A для Cortex-M3, ассемблер
      # задачи 12.C и пробы 12.D собираются закреплённым cargo;
      # `observed_debounce_size` фиксирует раскладку repr(Rust) у rustc 1.97.
      - run: |
          cargo +nightly test -p ch12 -p ch12-solutions -- --skip rustc_ --skip task_a_thumb \
            --skip task_c_no_indirect_calls --skip task_d_far_away --skip task_d_promise \
            --skip observed
      # Глава 13: ассемблер `rustc_` и задач 13.C и 13.D собирается
      # закреплённым cargo; `observed_` фиксирует имена типов и размеры
      # итераторов у rustc 1.97.
      - run: |
          cargo +nightly test -p ch13 -p ch13-solutions -- --skip rustc_ --skip observed \
            --skip task_c_vectorized --skip task_d_vectorization
      # Глава 14: ассемблер `rustc_` и примеры `cargo_` собираются
      # закреплённым cargo; `observed_` фиксирует размеры блоков Rc, Cow,
      # RefCell и Expr у rustc 1.97.
      - run: |
          cargo +nightly test -p ch14 -p ch14-solutions -- --skip rustc_ --skip cargo_ \
            --skip observed
      # Глава 15: ассемблер `rustc_`, опыты `cargo_` (запуск примеров под
      # strace) и группа `observed_`, фиксирующая размеры блоков SwissTable,
      # узлов BTreeMap и роста под glibc у rustc 1.97, к раскладке repr(Rust)
      # не относятся. Решения и проект от раскладки не зависят.
      - run: |
          cargo +nightly test -p ch15 -p ch15-solutions -- --skip rustc_ --skip cargo_ \
            --skip observed
      # Глава 16: unsafe и UB. Тесты asm (rustc_) собирают закреплённым cargo
      # и к раскладке repr(Rust) не относятся; каталог UB помечен ignore.
      - run: cargo +nightly test -p ch16 -p ch16-solutions -- --skip rustc_
      # Глава 17: низкоуровневая работа с памятью. asm-тест (rustc_) собирает
      # закреплённым cargo; каталог transmute (задача A) помечен ignore.
      - run: cargo +nightly test -p ch17 -p ch17-solutions -- --skip rustc_
      # Глава 19: встроенный ассемблер и интринсики. Тест chapter_instructions
      # собирает ассемблер закреплённым cargo и к раскладке repr(Rust) не
      # относится; остальное — регистры и SIMD, от раскладки не зависят.
      - run: cargo +nightly test -p ch19 -p ch19-solutions -- --skip chapter_instructions
      # Глава 22: группа `observed` фиксирует размеры автоматов async fn у
      # rustc 1.97 (раскладка автоматов не стабилизирована); остальное от
      # раскладки repr(Rust) не зависит.
      - run: cargo +nightly test -p ch22 -p ch22-solutions -- --skip observed
      # Глава 23: `rustc_` — снимки раскрытия и ассемблер закреплённого
      # компилятора, `observed` — текст stringify!; остальное от раскладки
      # не зависит.
      - run: cargo +nightly test -p ch23 -p ch23-solutions -- --skip rustc_ --skip observed
      # Глава 24: `rustc_` — снимки trybuild и раскрытия закреплённого
      # компилятора, `observed` — пробелы stringify! и раскладка repr(Rust)
      # без #[repr(C)]; остальное от раскладки не зависит.
      - run: cargo +nightly test -p ch24 -p ch24-macros -p ch24-solutions -- --skip rustc_ --skip observed
      # Глава 25: `rustc_` — ассемблер, секции и пробы закреплённого
      # компилятора, `observed` — общие адреса копий константы и размеры
      # LazyLock и Mutex; остальное от раскладки не зависит.
      - run: cargo +nightly test -p ch25 -p ch25-solutions -- --skip rustc_ --skip observed
      # Глава 26: `rustc_` — программы без libc, ассемблер и пробы
      # закреплённого компилятора; остальное от раскладки не зависит.
      - run: cargo +nightly test -p ch26 -p ch26-solutions -- --skip rustc_
      # Глава 27: `rustc_` — ассемблер HAL и задачи B, пробы типов, ELF
      # прошивки; остальное от раскладки не зависит, кадры исключений —
      # #[repr(C)]. Тест станции с QEMU помечен ignore.
      - run: cargo +nightly test -p ch27 -p ch27-hal -p ch27-solutions -- --skip rustc_
      # Глава 28: системные вызовы, процессы, сигналы, mmap и задачи —
      # от раскладки repr(Rust) не зависят. strace это задание не ставит:
      # если его нет в образе, тесты под ним пропускаются.
      - run: cargo +nightly test -p ch28 -p ch28-solutions
      # Глава 29: без собранного ядра опыты в QEMU пропускаются (их
      # проверяет задание kernel); разбор трассы и objdump задачи D2 и
      # служебные функции хоста от раскладки не зависят.
      - run: cargo +nightly test -p ch29 -p ch29-solutions
      # Глава 30: `rustc_` — ассемблер закреплённого компилятора,
      # `observed_` — время. valgrind и perf это задание не ставит, а
      # kernel.perf_event_paranoid оставляет 4: даже если perf в образе
      # есть, ядро его не пускает, и опыты под perf и valgrind
      # пропускаются. Структуры, байты которых считают опыты, —
      # repr(C), остальное от раскладки не зависит.
      - run: cargo +nightly test -p ch30 -p ch30-solutions -- --skip rustc_ --skip observed

  # Глава 29: модули ядра Linux 7.0 на Rust. Ядра собираются здесь же
  # (code/ch29/kernel/build.sh), опыты и задачи идут в QEMU под KVM.
  # Каталог ядер — вне target: его не должен трогать rust-cache.
  kernel:
    name: Модули ядра Linux в QEMU
    runs-on: ubuntu-24.04
    env:
      # Без ядра, QEMU или gdb тесты главы 29 не пропускаются, а падают.
      CH29_REQUIRE_KERNEL: 1
    steps:
      - uses: actions/checkout@v4
      # Ядро собирается тем же rustc, что и книга; крейтам core и kernel
      # нужны исходники стандартной библиотеки.
      - run: rustup toolchain install && rustup component add rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: kernel
      # clang, lld и llvm 18 — сборка с LLVM=1; libclang — bindgen; flex,
      # bison, bc, libelf-dev и cpio — сборка ядра; QEMU и gdb — опыты.
      - run: |
          sudo apt-get update && sudo apt-get install -y clang lld llvm libclang1-18 \
            flex bison bc libelf-dev cpio qemu-system-x86 gdb
      # На раннере /dev/kvm доступен только root; тесты открывают его на
      # чтение и запись, а без доступа берут TCG — в несколько раз дольше.
      - name: Доступ к KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Установить bindgen-cli 0.72.1
        run: cargo install --locked bindgen-cli@0.72.1
      - name: Каталог ядер
        run: |
          echo "CH29_KERNEL_DIR=$RUNNER_TEMP/ch29-kernel" >> "$GITHUB_ENV"
          echo "CH29_KERNEL=$RUNNER_TEMP/ch29-kernel/build" >> "$GITHUB_ENV"
          echo "CH29_KERNEL_DEBUG=$RUNNER_TEMP/ch29-kernel/build-debug" >> "$GITHUB_ENV"
      # Архив исходников (~250 МБ) не меняется: контрольную сумму
      # проверяет build.sh.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ch29-kernel/linux_7.0.0.orig.tar.gz
          key: linux-7.0.0-orig-c6343795
      - name: Ядра 7.0, обычное и отладочное
        run: bash code/ch29/kernel/build.sh
      # Модули главы и задач собираются с CLIPPY=1 без предупреждений,
      # заготовки задач — тоже; задача A — на отладочном ядре.
      - name: Опыты главы 29 и задачи в QEMU
        run: cargo test -p ch29 -p ch29-solutions

  thumb:
    name: Cortex-M и QEMU
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            firmware -> target
      - name: Крейты глав под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch06 -p ch06-regs -p telemetry-frame -p ch06-solutions -p ch07 \
              --no-default-features --target "$t"
          done
      - name: Глава 8 без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch08 -p ch08-solutions --no-default-features --target "$t"
          done
      # Глава 9: без alloc, с alloc (BTreeMap и Vec) и задачи с embedded-hal.
      - name: Глава 9 без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch09 --no-default-features --target "$t"
            cargo build -p ch09 --no-default-features --features alloc --target "$t"
            cargo build -p ch09-solutions -p ch09-exercises --target "$t"
          done
      # Глава 10: без alloc, с alloc и задачи с embedded-hal.
      - name: Глава 10 без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch10 --no-default-features --target "$t"
            cargo build -p ch10 --no-default-features --features alloc --target "$t"
            cargo build -p ch10-solutions -p ch10-exercises --target "$t"
          done
      # Глава 11: без alloc (таблицы во flash) и с alloc (Box, Rc, задачи).
      - name: Глава 11 без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch11 --no-default-features --target "$t"
            cargo build -p ch11 --no-default-features --features alloc --target "$t"
            cargo build -p ch11-solutions -p ch11-exercises --target "$t"
          done
      # Глава 12: без alloc (таблица обработчиков во flash), с alloc
      # (Box<dyn Fn>) и задачи A–C без std.
      - name: Глава 12 без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch12 --no-default-features --target "$t"
            cargo build -p ch12 --no-default-features --features alloc --target "$t"
            cargo build -p ch12-solutions -p ch12-exercises --no-default-features --target "$t"
          done
      # Глава 13: без alloc (кольцевой буфер, итераторы по срезам), с alloc
      # (collect в коллекции) и задачи без кучи и с ней.
      - name: Глава 13 без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch13 --no-default-features --target "$t"
            cargo build -p ch13 --no-default-features --features alloc --target "$t"
            cargo build -p ch13-solutions -p ch13-exercises --no-default-features --target "$t"
            cargo build -p ch13-solutions -p ch13-exercises --no-default-features \
              --features alloc --target "$t"
          done
      # Глава 14: без alloc остаются ячейки и ленивая инициализация, с alloc —
      # Box, Rc и Cow, а Arc — только там, где есть атомарный указатель
      # (не на Cortex-M0). Задачам A–C без std нужна только куча.
      - name: Глава 14 без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch14 --no-default-features --target "$t"
            cargo build -p ch14 --no-default-features --features alloc --target "$t"
            cargo build -p ch14-solutions -p ch14-exercises --no-default-features --target "$t"
          done
      # Глава 15: без std остаются коллекции heapless и аллокатор вручную,
      # с alloc — Vec, String, BTreeMap, VecDeque и свой GlobalAlloc. Решения
      # и проект главы хостовые (потоки, HashMap, strace), под Cortex-M не идут.
      - name: Глава 15 без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch15 --no-default-features --features alloc --target "$t"
          done
      # Глава 17: без std остаются MaybeUninit, операции с указателями,
      # volatile и NonNull; с alloc — ещё типы динамического размера с
      # хвостовым массивом. Решения и задачи главы хостовые (разбор ELF,
      # Miri), под Cortex-M не идут.
      - name: Глава 17 без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch17 --no-default-features --target "$t"
            cargo build -p ch17 --no-default-features --features alloc --target "$t"
          done
      # Глава 19: на хосте — встроенный ассемблер и интринсики x86-64 (их
      # проверяет задание host), а под Cortex-M остаётся модуль управления
      # ядром (wfi, критическая секция через PRIMASK).
      - name: Глава 19 (управление ядром) без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch19 --no-default-features --target "$t"
          done
      # Глава 21: на хосте — атомарные порядки, заборы и x86-примеры (их
      # проверяет задание host), а под Cortex-M остаётся кольцевой буфер SPSC
      # (atomic load/store без CAS широкого слова, собирается и на Cortex-M0).
      - name: Глава 21 (SPSC) без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch21 --no-default-features --target "$t"
          done
      # Глава 22: без std остаются future, автоматы, Pin, select/join и
      # исполнитель без кучи на RawWaker (только load/store — годится и для
      # Cortex-M0); исполнитель с очередью на Arc и потоки — только на хосте.
      # Задачи A и D1 (арена, исполнитель на флагах, очередь из прерывания)
      # тоже без std; их же собирает прошивка ch22-tasks.
      - name: Глава 22 (async без кучи) без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch22 --no-default-features --target "$t"
            cargo build -p ch22-solutions -p ch22-exercises --no-default-features --target "$t"
          done
      # Глава 23: макросы раскрываются на хосте, а их код — no_std. flags!,
      # peripheral! и fsm! из решений собирает и прошивка ch23-periph.
      - name: Глава 23 (код из макросов) без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch23 --no-default-features --target "$t"
            cargo build -p ch23-solutions -p ch23-exercises --target "$t"
          done
      # Глава 24: процедурные макросы собираются для хоста, их вывод — для
      # цели. Bitfield, include_svd! и #[timed] из решений собирает и
      # прошивка ch24-tasks; Timing на ARMv6-M нет (нет fetch_add).
      - name: Глава 24 (процедурные макросы) без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch24 --no-default-features --target "$t"
            cargo build -p ch24-solutions -p ch24-exercises --no-default-features --target "$t"
          done
      # Глава 25: таблицы и проверки при компиляции — no_std; Mutex и
      # LazyLock — за возможностью std. Таблицы использует прошивка
      # ch25-flash; fetch_add и compare_exchange на ARMv6-M нет.
      - name: Глава 25 (вычисления при компиляции) без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch25 --no-default-features --target "$t"
            cargo build -p ch25-solutions -p ch25-exercises --target "$t"
          done
      # Глава 26: слои core и alloc без std, функции раздела 26.5 и свои
      # memcpy, memmove и memset из задачи D. Модуль системных вызовов —
      # только для Linux x86-64. Прошивки ch26-* собирают это же без
      # cortex-m-rt.
      - name: Глава 26 (без std и libc) без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch26 --no-default-features --target "$t"
            cargo build -p ch26 --no-default-features --features alloc --target "$t"
            cargo build -p ch26-solutions -p ch26-exercises --target "$t"
          done
      # Глава 27: разбор исключений, приоритетов и MPU, PAC и HAL, решения
      # задач. Прошивки ch27-* — только для Cortex-M3, их собирает clippy.
      - name: Глава 27 (Cortex-M) под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch27 -p ch27-pac -p ch27-hal -p ch27-solutions -p ch27-exercises --target "$t"
          done
      # Глава 31: логика прерывания АЦП без std — та же, что тесты хоста и
      # прошивка ch31-tests в QEMU.
      - name: Глава 31 (логика прерывания) без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch31-irq --target "$t"
          done
      - name: Главы 0–2 без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch00 -p ch01 -p ch02 -p ch00-solutions -p ch01-solutions --target "$t"
          done
      - name: Главы 3–5 без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p ch03 -p ch04 -p ch05 -p ch03-solutions -p ch04-solutions \
              -p ch05-solutions --target "$t"
          done
      - name: Приложение A без std под три цели Cortex-M
        run: |
          for t in thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo build -p appendix-a --no-default-features --target "$t"
          done
      # Прошивки главы 27 — только для Cortex-M3 и старше: BASEPRI, CFSR,
      # MPU ARMv7-M, RTIC с thumbv7-backend и атомарный fetch_add, которых
      # у Cortex-M0 нет. Прошивка главы 30 читает счётчик тактов DWT,
      # которого нет у ARMv6-M. Под thumbv6m они исключены; тот же список —
      # в задаче 2.B (tests-shared/ch02.rs, M3_ONLY).
      - name: clippy для прошивок
        working-directory: firmware
        run: |
          m3only=(--exclude ch27-core --exclude ch27-nvic --exclude ch27-periph \
            --exclude ch27-irq --exclude ch27-fault --exclude ch27-rtic \
            --exclude ch27-station --exclude ch27-tasks --exclude ch30-cycles)
          for t in thumbv7m-none-eabi thumbv7em-none-eabihf; do
            cargo clippy --workspace --target "$t" -- -D warnings
          done
          cargo clippy --workspace "${m3only[@]}" --target thumbv6m-none-eabi -- -D warnings
      # Глава 27: code/ch27-pac — вывод svd2rust 0.37.1 по
      # code/ch27/svd/lm3s6965.svd после rustfmt. Повторная генерация не
      # должна ничего менять.
      - name: PAC главы 27 совпадает с выводом svd2rust
        run: |
          curl -sSL https://github.com/rust-embedded/svd2rust/releases/download/v0.37.1/svd2rust-x86_64-unknown-linux-gnu.gz \
            | gunzip > "$HOME/.cargo/bin/svd2rust"
          chmod +x "$HOME/.cargo/bin/svd2rust"
          bash code/ch27/svd/gen-pac.sh
          git diff --exit-code code/ch27-pac
      # flip-link нужен опыту раздела 27.7 в run-demos.sh: стек под .data и
      # .bss. Без него опыт пропускается.
      - name: Установить flip-link 0.1.12
        run: |
          curl -sSL https://github.com/knurling-rs/flip-link/releases/download/v0.1.12/flip-link-x86_64-unknown-linux-gnu.tar.xz \
            | tar -xJ --strip-components=1 -C "$HOME/.cargo/bin" flip-link-x86_64-unknown-linux-gnu/flip-link
      # gdb-multiarch нужен задаче 0.D в run-demos.sh, llvm — задаче 2.B,
      # arm-none-eabi-gcc с newlib — C-примерам главы 1 на Cortex-M.
      - run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-arm \
            gdb-multiarch llvm gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Опыты глав 0, 3, 5–13, 15, 22–27, 30, 31 в QEMU
        run: bash firmware/run-demos.sh
      # Станция главы 27 шлёт двоичные кадры в UART0: тест запускает её в
      # QEMU с UART0 в файл и разбирает файл крейтом telemetry-frame.
      - name: Станция главы 27 в QEMU, кадры разбирает хост
        run: cargo test -p ch27 --test station -- --ignored
      - name: Задача 2.B на дизассемблере всех прошивок
        run: cargo test -p ch02-solutions -- --ignored own_firmware --nocapture
      - name: C-примеры главы 1 на Cortex-M3 и Cortex-M4F в QEMU
        run: |
          bash code/ch01/c/run.sh
          bash solutions/ch01/c/run.sh
      - name: C-примеры главы 4 с arm-none-eabi-gcc
        run: bash code/ch04/c/run.sh
      # Глава 26: snprintf из newlib приносит в прошивку _malloc_r и _sbrk, а
      # memset циклом при -O2 без -ffreestanding зовёт саму себя.
      - name: C-примеры главы 26 с arm-none-eabi-gcc и newlib
        run: bash code/ch26/c/run.sh

  # Глава 31, инструменты, которые исполняют код: фаззеры, санитайзеры,
  # Miri и loom. Каждый скрипт сверяет вердикты и строки отчётов с текстом.
  ch31-dynamic:
    name: Глава 31 — фаззинг, санитайзеры, Miri, loom
    runs-on: ubuntu-24.04
    env:
      # Без nightly с rust-src опыты с санитайзерами не пропускаются, а
      # падают.
      CH31_REQUIRE_SANITIZERS: 1
    steps:
      - uses: actions/checkout@v4
      # Санитайзерам нужен -Zbuild-std, то есть исходники std.
      - run: |
          rustup toolchain install
          rustup toolchain install nightly --profile minimal --component miri,rust-src
      # llvm-symbolizer из пакета llvm: без него ASan печатает в отчёте
      # адреса, а не имена функций и строки, и тест сверить их не может.
      - run: sudo apt-get update && sudo apt-get install -y llvm
      - uses: Swatinem/rust-cache@v2
        with:
          key: ch31-dynamic
          workspaces: |
            . -> target
            code/ch31/fuzz -> target
            solutions/ch31/fuzz -> target
      - name: Установить cargo-fuzz 0.13.2
        run: cargo install --locked cargo-fuzz@0.13.2
      - run: cargo +nightly miri setup
      # Раздел 31.5: ASan и TSan над программой san, с -Zbuild-std и без.
      - run: cargo test -p ch31 --test sanitizers
      # Раздел 31.4 и задача 31.B: падения и их число запусков при одном
      # зерне, чистые прогоны исправленных разборов.
      - run: bash code/ch31/fuzz/run.sh
      - run: bash solutions/ch31/fuzz/run.sh
      # Раздел 31.6: опыты san под Miri и тесты главы под обеими моделями
      # алиасинга. Тесты, которые запускают cargo и дочерние процессы, и
      # свойства proptest (файлу регрессий нужен getcwd, которого в
      # изоляции Miri нет, а сотни случаев шли бы минуты) под Miri
      # помечены ignore.
      - run: bash code/ch31/miri/run.sh
      - run: cargo +nightly miri test -p ch31 -p ch31-irq -p ch31-solutions
      - run: cargo +nightly miri test -p ch31 -p ch31-irq -p ch31-solutions
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
      # Раздел 31.6: loom перебирает чередования очереди главы 21. Свой
      # каталог сборки: --cfg loom меняет все крейты.
      - run: RUSTFLAGS="--cfg loom" cargo test -p ch31 --release --test loom --target-dir target/loom

  # Глава 31, инструменты, которые рассуждают о коде или о зависимостях:
  # Kani, CBMC, cargo-mutants, cargo-deny, cargo-audit, cargo-vet, — и
  # C-примеры главы: им нужен CBMC из пакета Kani.
  ch31-static:
    name: Глава 31 — Kani, мутанты, цепочка поставок
    runs-on: ubuntu-24.04
    env:
      # Без cargo-mutants прогон задачи D пропускается, с этим флагом —
      # падает.
      CH31_REQUIRE_MUTANTS: 1
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ch31-static
      # Версии — те, с которых снят вывод в тексте главы.
      - name: Установить Kani 0.68.0, cargo-mutants, cargo-deny, cargo-audit и cargo-vet
        run: |
          cargo install --locked kani-verifier@0.68.0 cargo-mutants@27.1.0 \
            cargo-deny@0.20.2 cargo-audit@0.22.2 cargo-vet@0.10.3
          cargo kani setup
      # Разделы 31.7 и 31.10, задачи C и D: вердикты всех доказательств,
      # контрпример parse_v1, граница развёртки, пустое доказательство.
      - run: bash code/ch31/kani/run.sh
      # «Как в C» разделов 31.4 и 31.7: libFuzzer и ASan на той же ошибке в
      # C и CBMC из пакета Kani. libclang-rt-18-dev — рантаймы compiler-rt
      # для clang (gcc с libasan и clang 18 есть в образе); без них и без
      # CBMC скрипт пропускал бы эти части.
      - run: sudo apt-get update && sudo apt-get install -y libclang-rt-18-dev
      - run: bash code/ch31/c/run.sh
      # Разделы 31.8 и 31.10: два выживших мутанта до тестов проекта, ни
      # одного — после.
      - run: bash code/ch31/mutants/run.sh
      # Задача D: тесты решения убивают всех мутантов хранилища проекта.
      - run: cargo test -p ch31-solutions
      # Раздел 31.9: политика deny.toml на пяти рабочих пространствах, код
      # при сборке, cargo audit на Cargo.lock учебника и на старом smallvec,
      # cargo vet. Нужна сеть: база RustSec и сведения crates.io.
      - run: bash code/ch31/supply/run.sh

  book:
    name: mdBook
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Установить mdBook 0.5.4
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.cargo/bin"
      # mdBook на пропущенный файл печатает ERROR, но завершается с кодом 0,
      # а на пропущенный якорь молча вставляет пустой блок. Первое ловит
      # grep по журналу, второе — отдельная проверка всех ссылок.
      - run: python3 tools/check-includes.py
      - run: |
          mdbook build 2>&1 | tee mdbook.log
          # Предупреждение «search index is very large» безвредно (поиск
          # работает) и неизбежно растёт вместе с книгой; на нём не падаем.
          # Любой другой WARN/ERROR (пропущенный файл, битая ссылка) — отказ.
          if grep -E "WARN|ERROR" mdbook.log | grep -qv "search index is very large"; then
            echo "mdBook: неожиданные WARN/ERROR в журнале"; exit 1
          fi
      # Якоря после `#` и номера разделов в тексте ссылок проверяются уже
      # по собранному HTML: id заголовков выводит mdBook.
      - run: python3 tools/check-links.py book
