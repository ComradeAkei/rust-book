<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">Как восемь битов образуют число</title>
<desc id="desc">Байт 00001101: единицы выбирают веса 8, 4 и 1. Их сумма равна 13.</desc>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2864b4"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287354"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a45b12"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a93832"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7552a3"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536477"/></marker></defs>
<style>text{font-family:"DejaVu Sans",sans-serif;fill:#172b41}.tag{font-size:15px;font-weight:700;letter-spacing:2px;fill:#536477}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#455c73}.code{font-family:"DejaVu Sans Mono",monospace;font-size:21px}.note{font-size:20px;fill:#455c73}</style>
<rect width="1000" height="440" rx="18" fill="#f8fafc"/>
<rect x="0" y="0" width="8" height="440" rx="4" fill="#2864b4"/>
<text x="36" y="34" class="tag" text-anchor="start">RUST · СХЕМА</text>
<text x="36" y="77" class="title" text-anchor="start">Как восемь битов образуют число</text>
<text x="36" y="132" class="small" text-anchor="start">Вес каждого разряда</text>
<text x="92" y="174" class="label" text-anchor="middle">128</text>
<rect x="40" y="193" width="104" height="82" rx="12" fill="#eef1f5" stroke="#536477" stroke-width="2"/>
<text x="92" y="246" class="title" text-anchor="middle">0</text>
<text x="208" y="174" class="label" text-anchor="middle">64</text>
<rect x="156" y="193" width="104" height="82" rx="12" fill="#eef1f5" stroke="#536477" stroke-width="2"/>
<text x="208" y="246" class="title" text-anchor="middle">0</text>
<text x="324" y="174" class="label" text-anchor="middle">32</text>
<rect x="272" y="193" width="104" height="82" rx="12" fill="#eef1f5" stroke="#536477" stroke-width="2"/>
<text x="324" y="246" class="title" text-anchor="middle">0</text>
<text x="440" y="174" class="label" text-anchor="middle">16</text>
<rect x="388" y="193" width="104" height="82" rx="12" fill="#eef1f5" stroke="#536477" stroke-width="2"/>
<text x="440" y="246" class="title" text-anchor="middle">0</text>
<text x="556" y="174" class="label" text-anchor="middle">8</text>
<rect x="504" y="193" width="104" height="82" rx="12" fill="#e5f4ed" stroke="#287354" stroke-width="2"/>
<text x="556" y="246" class="title" text-anchor="middle">1</text>
<text x="672" y="174" class="label" text-anchor="middle">4</text>
<rect x="620" y="193" width="104" height="82" rx="12" fill="#e5f4ed" stroke="#287354" stroke-width="2"/>
<text x="672" y="246" class="title" text-anchor="middle">1</text>
<text x="788" y="174" class="label" text-anchor="middle">2</text>
<rect x="736" y="193" width="104" height="82" rx="12" fill="#eef1f5" stroke="#536477" stroke-width="2"/>
<text x="788" y="246" class="title" text-anchor="middle">0</text>
<text x="904" y="174" class="label" text-anchor="middle">1</text>
<rect x="852" y="193" width="104" height="82" rx="12" fill="#e5f4ed" stroke="#287354" stroke-width="2"/>
<text x="904" y="246" class="title" text-anchor="middle">1</text>
<rect x="40" y="310" width="916" height="74" rx="12" fill="#e5f4ed" stroke="#287354" stroke-width="2"/>
<text x="58" y="344" class="label" text-anchor="start" style="fill:#287354">0b0000_1101 = 8 + 4 + 1 = 13</text>
<text x="36" y="403" class="note" text-anchor="start">В одном байте 2⁸ = 256 комбинаций: для u8 это числа от 0 до 255.</text>
</svg>
