<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Срез смотрит внутрь массива</title>
<desc id="desc">Массив a содержит 10, 20, 30, 40. Ссылка s на a[1..3] хранит адрес элемента 20 и длину 2, не создавая копию элементов.</desc>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2864b4"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287354"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a45b12"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a93832"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7552a3"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536477"/></marker></defs>
<style>text{font-family:"DejaVu Sans",sans-serif;fill:#172b41}.tag{font-size:15px;font-weight:700;letter-spacing:2px;fill:#536477}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#455c73}.code{font-family:"DejaVu Sans Mono",monospace;font-size:21px}.note{font-size:20px;fill:#455c73}</style>
<rect width="1000" height="500" rx="18" fill="#f8fafc"/>
<rect x="0" y="0" width="8" height="500" rx="4" fill="#2864b4"/>
<text x="36" y="34" class="tag" text-anchor="start">RUST · СХЕМА</text>
<text x="36" y="77" class="title" text-anchor="start">Срез смотрит внутрь массива</text>
<text x="36" y="128" class="code" text-anchor="start">a: [u8; 4] = [10, 20, 30, 40]</text>
<text x="405" y="162" class="small" text-anchor="middle">индекс 0</text>
<rect x="340" y="180" width="130" height="85" rx="12" fill="#eef1f5" stroke="#536477" stroke-width="2"/>
<text x="405" y="232" class="label" text-anchor="middle">10</text>
<text x="550" y="162" class="small" text-anchor="middle">индекс 1</text>
<rect x="485" y="180" width="130" height="85" rx="12" fill="#e5f4ed" stroke="#287354" stroke-width="2"/>
<text x="550" y="232" class="label" text-anchor="middle">20</text>
<text x="695" y="162" class="small" text-anchor="middle">индекс 2</text>
<rect x="630" y="180" width="130" height="85" rx="12" fill="#e5f4ed" stroke="#287354" stroke-width="2"/>
<text x="695" y="232" class="label" text-anchor="middle">30</text>
<text x="840" y="162" class="small" text-anchor="middle">индекс 3</text>
<rect x="775" y="180" width="130" height="85" rx="12" fill="#eef1f5" stroke="#536477" stroke-width="2"/>
<text x="840" y="232" class="label" text-anchor="middle">40</text>
<rect x="60" y="340" width="280" height="100" rx="12" fill="#e8f1ff" stroke="#2864b4" stroke-width="2"/>
<text x="78" y="374" class="label" text-anchor="start" style="fill:#2864b4">s: &amp;[u8]</text>
<text x="78" y="407" class="body" text-anchor="start">ptr  |  len = 2</text>
<path d="M 340 370 L 485 265" fill="none" stroke="#2864b4" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<text x="575" y="323" class="code" text-anchor="middle">s = &amp;a[1..3]</text>
<text x="575" y="358" class="body" text-anchor="middle">доступны 20 и 30</text>
<text x="36" y="463" class="note" text-anchor="start">Длина — число элементов; верхняя граница 3 в срез не входит.</text>
</svg>
