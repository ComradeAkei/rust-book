<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Прерывание и защищённый участок</title>
<desc id="desc">Обычное прерывание приостанавливает основной код, обработчик сбрасывает запрос и возвращается. В критической секции маскируемый запрос ждёт восстановления маски.</desc>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2864b4"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287354"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a45b12"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a93832"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7552a3"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536477"/></marker></defs>
<style>text{font-family:"DejaVu Sans",sans-serif;fill:#172b41}.tag{font-size:15px;font-weight:700;letter-spacing:2px;fill:#536477}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#455c73}.code{font-family:"DejaVu Sans Mono",monospace;font-size:21px}.note{font-size:20px;fill:#455c73}</style>
<rect width="1000" height="620" rx="18" fill="#f8fafc"/>
<rect x="0" y="0" width="8" height="620" rx="4" fill="#2864b4"/>
<text x="36" y="34" class="tag" text-anchor="start">RUST · СХЕМА</text>
<text x="36" y="77" class="title" text-anchor="start">Прерывание и защищённый участок</text>
<text x="40" y="127" class="label" text-anchor="start">Обычное выполнение</text>
<rect x="40" y="155" width="250" height="115" rx="12" fill="#e8f1ff" stroke="#2864b4" stroke-width="2"/>
<text x="58" y="189" class="label" text-anchor="start" style="fill:#2864b4">main</text>
<text x="58" y="222" class="body" text-anchor="start">работа с данными</text>
<rect x="395" y="155" width="235" height="115" rx="12" fill="#fff0dc" stroke="#a45b12" stroke-width="2"/>
<text x="413" y="189" class="label" text-anchor="start" style="fill:#a45b12">Обработчик IRQ</text>
<text x="413" y="222" class="body" text-anchor="start">сброс запроса</text>
<text x="413" y="251" class="body" text-anchor="start">учёт события</text>
<rect x="735" y="155" width="225" height="115" rx="12" fill="#e8f1ff" stroke="#2864b4" stroke-width="2"/>
<text x="753" y="189" class="label" text-anchor="start" style="fill:#2864b4">Снова main</text>
<text x="753" y="222" class="body" text-anchor="start">продолжение</text>
<path d="M 295 210 L 390 210" fill="none" stroke="#536477" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
<text x="342" y="147" class="small" text-anchor="middle">запрос</text>
<path d="M 635 210 L 730 210" fill="none" stroke="#536477" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
<text x="682" y="147" class="small" text-anchor="middle">возврат</text>
<text x="40" y="330" class="label" text-anchor="start">Внутри критической секции</text>
<rect x="40" y="360" width="500" height="130" rx="12" fill="#e5f4ed" stroke="#287354" stroke-width="2"/>
<text x="58" y="394" class="label" text-anchor="start" style="fill:#287354">main: доступ к общим данным</text>
<text x="58" y="427" class="body" text-anchor="start">обычные IRQ временно запрещены</text>
<text x="58" y="456" class="body" text-anchor="start">сохраняется прежняя маска</text>
<rect x="635" y="360" width="325" height="130" rx="12" fill="#fff0dc" stroke="#a45b12" stroke-width="2"/>
<text x="653" y="394" class="label" text-anchor="start" style="fill:#a45b12">Запрос таймера</text>
<text x="653" y="427" class="body" text-anchor="start">остаётся ожидающим</text>
<text x="653" y="456" class="body" text-anchor="start">обработчик пока не входит</text>
<text x="40" y="535" class="note" text-anchor="start">Выход из секции → восстановление маски → ожидающий IRQ может выполниться.</text>
<text x="36" y="583" class="note" text-anchor="start">Показана защита от обычных маскируемых IRQ на одном ядре.</text>
</svg>
