<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
<title id="title">Arc и Mutex решают разные задачи</title>
<desc id="desc">Два клона Arc ведут к одному выделению с одним Mutex и одними данными T. Arc отвечает за общее владение, MutexGuard — за временный исключительный доступ к T.</desc>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2864b4"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287354"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a45b12"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a93832"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7552a3"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536477"/></marker></defs>
<style>text{font-family:"DejaVu Sans",sans-serif;fill:#172b41}.tag{font-size:15px;font-weight:700;letter-spacing:2px;fill:#536477}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#455c73}.code{font-family:"DejaVu Sans Mono",monospace;font-size:21px}.note{font-size:20px;fill:#455c73}</style>
<rect width="1000" height="570" rx="18" fill="#f8fafc"/>
<rect x="0" y="0" width="8" height="570" rx="4" fill="#2864b4"/>
<text x="36" y="34" class="tag" text-anchor="start">RUST · СХЕМА</text>
<text x="36" y="77" class="title" text-anchor="start">Arc и Mutex решают разные задачи</text>
<rect x="40" y="150" width="240" height="110" rx="12" fill="#e8f1ff" stroke="#2864b4" stroke-width="2"/>
<text x="58" y="184" class="label" text-anchor="start" style="fill:#2864b4">Поток 1</text>
<text x="58" y="217" class="body" text-anchor="start">свой Arc</text>
<rect x="40" y="335" width="240" height="110" rx="12" fill="#e8f1ff" stroke="#2864b4" stroke-width="2"/>
<text x="58" y="369" class="label" text-anchor="start" style="fill:#2864b4">Поток 2</text>
<text x="58" y="402" class="body" text-anchor="start">клон того же Arc</text>
<rect x="390" y="130" width="570" height="345" rx="12" fill="#eef1f5" stroke="#536477" stroke-width="2"/>
<text x="415" y="168" class="label" text-anchor="start">Одно общее выделение памяти</text>
<rect x="415" y="215" width="210" height="135" rx="12" fill="#f1eafa" stroke="#7552a3" stroke-width="2"/>
<text x="433" y="249" class="label" text-anchor="start" style="fill:#7552a3">Счётчик Arc</text>
<text x="433" y="282" class="body" text-anchor="start">2 владельца</text>
<rect x="660" y="215" width="270" height="135" rx="12" fill="#e5f4ed" stroke="#287354" stroke-width="2"/>
<text x="678" y="249" class="label" text-anchor="start" style="fill:#287354">Mutex&lt;T&gt;</text>
<text x="678" y="282" class="body" text-anchor="start">одни данные T</text>
<text x="678" y="311" class="body" text-anchor="start">доступ через guard</text>
<path d="M 280 205 L 415 248" fill="none" stroke="#536477" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
<path d="M 280 390 L 415 315" fill="none" stroke="#536477" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
<text x="415" y="406" class="body" text-anchor="start">lock() → MutexGuard → работа с T</text>
<text x="415" y="435" class="body" text-anchor="start">drop(guard) → освобождение замка</text>
<text x="36" y="533" class="note" text-anchor="start">Arc управляет временем жизни; Mutex — одновременным доступом.</text>
</svg>
