<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
<title id="title">Путь одного измерения</title>
<desc id="desc">Датчик или таймер QEMU даёт отсчёт прошивке Cortex-M. Прошивка кодирует кадр и отправляет байты по UART. Хост Linux разбирает кадры и хранит измерения. Кодер и парсер используют общий формат telemetry-frame.</desc>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2864b4"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287354"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a45b12"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a93832"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7552a3"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536477"/></marker></defs>
<style>text{font-family:"DejaVu Sans",sans-serif;fill:#172b41}.tag{font-size:15px;font-weight:700;letter-spacing:2px;fill:#536477}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#455c73}.code{font-family:"DejaVu Sans Mono",monospace;font-size:21px}.note{font-size:20px;fill:#455c73}</style>
<rect width="1000" height="580" rx="18" fill="#f8fafc"/>
<rect x="0" y="0" width="8" height="580" rx="4" fill="#2864b4"/>
<text x="36" y="34" class="tag" text-anchor="start">RUST · СХЕМА</text>
<text x="36" y="77" class="title" text-anchor="start">Путь одного измерения</text>
<rect x="40" y="150" width="220" height="150" rx="12" fill="#e5f4ed" stroke="#287354" stroke-width="2"/>
<text x="58" y="184" class="label" text-anchor="start" style="fill:#287354">Датчик</text>
<text x="58" y="217" class="body" text-anchor="start">или таймер QEMU</text>
<text x="58" y="246" class="body" text-anchor="start">выдаёт отсчёт</text>
<rect x="340" y="150" width="260" height="150" rx="12" fill="#e8f1ff" stroke="#2864b4" stroke-width="2"/>
<text x="358" y="184" class="label" text-anchor="start" style="fill:#2864b4">Cortex-M</text>
<text x="358" y="217" class="body" text-anchor="start">отсчёт → кадр</text>
<text x="358" y="246" class="body" text-anchor="start">отправка байтов</text>
<rect x="730" y="150" width="230" height="150" rx="12" fill="#f1eafa" stroke="#7552a3" stroke-width="2"/>
<text x="748" y="184" class="label" text-anchor="start" style="fill:#7552a3">Linux</text>
<text x="748" y="217" class="body" text-anchor="start">разбор кадров</text>
<text x="748" y="246" class="body" text-anchor="start">хранение, TCP</text>
<path d="M 265 225 L 335 225" fill="none" stroke="#536477" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
<path d="M 605 225 L 725 225" fill="none" stroke="#536477" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
<text x="665.0" y="213.0" class="small" text-anchor="middle">UART</text>
<rect x="40" y="390" width="920" height="100" rx="12" fill="#eef1f5" stroke="#536477" stroke-width="2"/>
<text x="58" y="424" class="label" text-anchor="start" style="fill:#536477">Общий формат: telemetry-frame (no_std)</text>
<text x="58" y="457" class="body" text-anchor="start">Одни типы и правила кодирования для прошивки и парсера на хосте.</text>
<path d="M 470 385 L 470 305" fill="none" stroke="#536477" stroke-width="2.5" marker-end="url(#arrow-gray)" stroke-dasharray="7 5"/>
<path d="M 845 385 L 845 305" fill="none" stroke="#536477" stroke-width="2.5" marker-end="url(#arrow-gray)" stroke-dasharray="7 5"/>
<text x="36" y="543" class="note" text-anchor="start">UART переносит байты; границы кадров задаёт протокол.</text>
</svg>
