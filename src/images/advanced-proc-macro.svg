<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">Процедурный макрос: от записи к коду</title>
<desc id="desc">Токены объявления разбираются syn в дерево. quote подставляет имена и поля в новые токены реализации. Только затем компилятор Rust проверяет типы и вычисляет размеры.</desc>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2864b4"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287354"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a45b12"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a93832"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7552a3"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536477"/></marker></defs>
<style>text{font-family:"DejaVu Sans",sans-serif;fill:#172b41}.tag{font-size:15px;font-weight:700;letter-spacing:2px;fill:#536477}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#455c73}.code{font-family:"DejaVu Sans Mono",monospace;font-size:21px}.note{font-size:20px;fill:#455c73}</style>
<rect width="1000" height="590" rx="18" fill="#f8fafc"/>
<rect x="0" y="0" width="8" height="590" rx="4" fill="#2864b4"/>
<text x="36" y="34" class="tag" text-anchor="start">RUST · СХЕМА</text>
<text x="36" y="77" class="title" text-anchor="start">Процедурный макрос: от записи к коду</text>
<rect x="40" y="145" width="400" height="115" rx="12" fill="#e8f1ff" stroke="#2864b4" stroke-width="2"/>
<text x="58" y="179" class="label" text-anchor="start" style="fill:#2864b4">1. Токены объявления</text>
<text x="58" y="212" class="body" text-anchor="start">pub struct Header { … }</text>
<rect x="560" y="145" width="400" height="115" rx="12" fill="#f1eafa" stroke="#7552a3" stroke-width="2"/>
<text x="578" y="179" class="label" text-anchor="start" style="fill:#7552a3">2. Дерево syn</text>
<text x="578" y="212" class="body" text-anchor="start">имя, поля, записи их типов</text>
<rect x="560" y="355" width="400" height="125" rx="12" fill="#fff0dc" stroke="#a45b12" stroke-width="2"/>
<text x="578" y="389" class="label" text-anchor="start" style="fill:#a45b12">3. Шаблон quote!</text>
<text x="578" y="422" class="body" text-anchor="start">подстановка #name</text>
<text x="578" y="451" class="body" text-anchor="start">токены новой реализации</text>
<rect x="40" y="355" width="400" height="125" rx="12" fill="#e5f4ed" stroke="#287354" stroke-width="2"/>
<text x="58" y="389" class="label" text-anchor="start" style="fill:#287354">4. Проверка компилятором</text>
<text x="58" y="422" class="body" text-anchor="start">типы, размеры, ограничения</text>
<text x="58" y="451" class="body" text-anchor="start">для сгенерированного кода</text>
<path d="M 440 202 L 560 202" fill="none" stroke="#536477" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
<text x="500.0" y="190.0" class="small" text-anchor="middle">разбор</text>
<path d="M 760 260 L 760 355" fill="none" stroke="#536477" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
<text x="790" y="316" class="small" text-anchor="start">генерация</text>
<path d="M 560 417 L 440 417" fill="none" stroke="#536477" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
<text x="500.0" y="405.0" class="small" text-anchor="middle">выход</text>
<text x="36" y="553" class="note" text-anchor="start">Макрос читает запись типа; размер этого типа вычисляет компилятор.</text>
</svg>
