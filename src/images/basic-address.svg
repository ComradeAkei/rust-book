<path d="M 180 271 V 321 H 607 V 270" fill="none" stroke="#2864b4" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<text x="365" y="356" class="body" text-anchor="start">Переход к данным по адресу</text>
<text x="36" y="400" class="note" text-anchor="start">Адрес 1002 и лежащее по нему число 30 — разные части этой модели.</text>
<text x="36" y="430" class="note" text-anchor="start">Право доступа к памяти проверяется отдельно от числового адреса.</text>
</svg>
