<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Адрес и содержимое памяти</title>
<desc id="desc">Указатель p содержит адрес 1002. По этому адресу находится байт 30. Копия указателя не создаёт копию байта.</desc>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2864b4"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287354"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a45b12"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a93832"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7552a3"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536477"/></marker></defs>
<style>text{font-family:"DejaVu Sans",sans-serif;fill:#172b41}.tag{font-size:15px;font-weight:700;letter-spacing:2px;fill:#536477}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#455c73}.code{font-family:"DejaVu Sans Mono",monospace;font-size:21px}.note{font-size:20px;fill:#455c73}</style>
<rect width="1000" height="460" rx="18" fill="#f8fafc"/>
<rect x="0" y="0" width="8" height="460" rx="4" fill="#2864b4"/>
<text x="36" y="34" class="tag" text-anchor="start">RUST · СХЕМА</text>
<text x="36" y="77" class="title" text-anchor="start">Адрес и содержимое памяти</text>
<rect x="36" y="151" width="286" height="120" rx="12" fill="#e8f1ff" stroke="#2864b4" stroke-width="2"/>
<text x="54" y="185" class="label" text-anchor="start" style="fill:#2864b4">Указатель p</text>
<text x="54" y="218" class="body" text-anchor="start">хранит адрес 1002</text>
<text x="54" y="247" class="body" text-anchor="start">*p читает число 30</text>
<text x="365" y="128" class="small" text-anchor="start">Адреса байтов</text>
<text x="411" y="163" class="small" text-anchor="middle">1000</text>
<rect x="365" y="183" width="92" height="85" rx="6" fill="#eef1f5" stroke="#536477" stroke-width="2"/>
<text x="411" y="236" class="title" text-anchor="middle">10</text>
<text x="509" y="163" class="small" text-anchor="middle">1001</text>
<rect x="463" y="183" width="92" height="85" rx="6" fill="#eef1f5" stroke="#536477" stroke-width="2"/>
<text x="509" y="236" class="title" text-anchor="middle">20</text>
<text x="607" y="163" class="small" text-anchor="middle">1002</text>
<rect x="561" y="183" width="92" height="85" rx="6" fill="#e5f4ed" stroke="#287354" stroke-width="2"/>
<text x="607" y="236" class="title" text-anchor="middle">30</text>
<text x="705" y="163" class="small" text-anchor="middle">1003</text>
<rect x="659" y="183" width="92" height="85" rx="6" fill="#eef1f5" stroke="#536477" stroke-width="2"/>
<text x="705" y="236" class="title" text-anchor="middle">40</text>
<text x="803" y="163" class="small" text-anchor="middle">1004</text>
<rect x="757" y="183" width="92" height="85" rx="6" fill="#eef1f5" stroke="#536477" stroke-width="2"/>
<text x="803" y="236" class="title" text-anchor="middle">50</text>
<text x="901" y="163" class="small" text-anchor="middle">1005</text>
<rect x="855" y="183" width="92" height="85" rx="6" fill="#eef1f5" stroke="#536477" stroke-width="2"/>
