<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
<title id="title">Библиотека по потребностям программы</title>
<desc id="desc">std использует alloc и core; alloc добавляет выделение памяти, а core позволяет считать без кучи и интерфейсов ОС.</desc>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2864b4"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287354"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a45b12"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a93832"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7552a3"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536477"/></marker></defs>
<style>text{font-family:"DejaVu Sans",sans-serif;fill:#172b41}.tag{font-size:15px;font-weight:700;letter-spacing:2px;fill:#536477}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#455c73}.code{font-family:"DejaVu Sans Mono",monospace;font-size:21px}.note{font-size:20px;fill:#455c73}</style>
<rect width="1000" height="580" rx="18" fill="#f8fafc"/>
<rect x="0" y="0" width="8" height="580" rx="4" fill="#2864b4"/>
<text x="36" y="34" class="tag" text-anchor="start">RUST · СХЕМА</text>
<text x="36" y="77" class="title" text-anchor="start">Библиотека по потребностям программы</text>
<rect x="40" y="130" width="920" height="100" rx="12" fill="#f1eafa" stroke="#7552a3" stroke-width="2"/>
<text x="60" y="172" class="label" text-anchor="start">std</text>
<text x="240" y="166" class="body" text-anchor="start">Файлы, сеть, потоки</text>
<text x="240" y="195" class="body" text-anchor="start">плюс alloc и core</text>
<text x="650" y="186" class="small" text-anchor="start">Нужна поддержка ОС</text>
<rect x="40" y="260" width="920" height="100" rx="12" fill="#e8f1ff" stroke="#2864b4" stroke-width="2"/>
<text x="60" y="302" class="label" text-anchor="start">alloc</text>
<text x="240" y="296" class="body" text-anchor="start">Vec, Box, String</text>
<text x="240" y="325" class="body" text-anchor="start">плюс core</text>
<text x="650" y="316" class="small" text-anchor="start">Нужен аллокатор</text>
<rect x="40" y="390" width="920" height="100" rx="12" fill="#e5f4ed" stroke="#287354" stroke-width="2"/>
<text x="60" y="432" class="label" text-anchor="start">core</text>
<text x="240" y="426" class="body" text-anchor="start">Числа, срезы, Option</text>
<text x="240" y="455" class="body" text-anchor="start">CRC без растущего буфера</text>
<text x="650" y="446" class="small" text-anchor="start">Без кучи и API ОС</text>
<path d="M 140 230 L 140 258" fill="none" stroke="#536477" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
<path d="M 140 360 L 140 388" fill="none" stroke="#536477" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
<text x="36" y="543" class="note" text-anchor="start">Стрелки: верхний слой использует нижний. Запуск программы настраивают отдельно.</text>
</svg>
