<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">Откуда берутся 12 байт структуры</title>
<desc id="desc">repr(C) с полями u8 channel, u32 value и u8 flags: channel по смещению 0, value по 4, flags по 8; три байта заполнения перед value и три в конце.</desc>
