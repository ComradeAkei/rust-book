<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Дескриптор: номер, владелец и ресурс</title>
<desc id="desc">OwnedFd владеет одной записью таблицы дескрипторов процесса. BorrowedFd заимствует её без закрытия. Копия номера не открывает ресурс ещё раз.</desc>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2864b4"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287354"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a45b12"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a93832"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7552a3"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536477"/></marker></defs>
<style>text{font-family:"DejaVu Sans",sans-serif;fill:#172b41}.tag{font-size:15px;font-weight:700;letter-spacing:2px;fill:#536477}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#455c73}.code{font-family:"DejaVu Sans Mono",monospace;font-size:21px}.note{font-size:20px;fill:#455c73}</style>
<rect width="1000" height="600" rx="18" fill="#f8fafc"/>
<rect x="0" y="0" width="8" height="600" rx="4" fill="#2864b4"/>
<text x="36" y="34" class="tag" text-anchor="start">RUST · СХЕМА</text>
<text x="36" y="77" class="title" text-anchor="start">Дескриптор: номер, владелец и ресурс</text>
<rect x="40" y="150" width="290" height="130" rx="12" fill="#e8f1ff" stroke="#2864b4" stroke-width="2"/>
<text x="58" y="184" class="label" text-anchor="start" style="fill:#2864b4">OwnedFd</text>
<text x="58" y="217" class="body" text-anchor="start">владеет номером 3</text>
<text x="58" y="246" class="body" text-anchor="start">Drop вызывает close</text>
<text x="505" y="126" class="label" text-anchor="middle">Таблица процесса</text>
<rect x="410" y="155" width="190" height="120" rx="12" fill="#e5f4ed" stroke="#287354" stroke-width="2"/>
<text x="428" y="189" class="label" text-anchor="start" style="fill:#287354">Запись 3</text>
<text x="428" y="222" class="body" text-anchor="start">ссылка на файл</text>
<rect x="715" y="150" width="245" height="130" rx="12" fill="#f1eafa" stroke="#7552a3" stroke-width="2"/>
<text x="733" y="184" class="label" text-anchor="start" style="fill:#7552a3">Объект ядра</text>
<text x="733" y="217" class="body" text-anchor="start">позиция, флаги</text>
<text x="733" y="246" class="body" text-anchor="start">открытого файла</text>
<path d="M 335 213 L 405 213" fill="none" stroke="#536477" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
<path d="M 605 213 L 710 213" fill="none" stroke="#536477" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
<rect x="40" y="360" width="290" height="130" rx="12" fill="#e5f4ed" stroke="#287354" stroke-width="2"/>
<text x="58" y="394" class="label" text-anchor="start" style="fill:#287354">BorrowedFd&lt;&#x27;a&gt;</text>
<text x="58" y="427" class="body" text-anchor="start">временный доступ</text>
<text x="58" y="456" class="body" text-anchor="start">не закрывает запись</text>
<path d="M 185 285 L 185 355" fill="none" stroke="#536477" stroke-width="2.5" marker-end="url(#arrow-gray)" stroke-dasharray="7 5"/>
<text x="210" y="325" class="small" text-anchor="start">as_fd()</text>
<rect x="410" y="360" width="550" height="130" rx="12" fill="#eef1f5" stroke="#536477" stroke-width="2"/>
<text x="428" y="394" class="label" text-anchor="start" style="fill:#536477">Копирование RawFd: 3 → 3</text>
<text x="428" y="427" class="body" text-anchor="start">Скопировано только целое число.</text>
<text x="428" y="456" class="body" text-anchor="start">Новая запись таблицы не появилась.</text>
<text x="36" y="563" class="note" text-anchor="start">dup создаёт ещё одну запись таблицы; обычное присваивание числа — нет.</text>
</svg>
