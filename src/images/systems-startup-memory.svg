<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">Подготовка памяти перед main</title>
<desc id="desc">Обработчик Reset обнуляет .bss и копирует начальные значения .data из flash в рабочую память RAM, после чего запускает main.</desc>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2864b4"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#287354"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a45b12"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a93832"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7552a3"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536477"/></marker></defs>
<style>text{font-family:"DejaVu Sans",sans-serif;fill:#172b41}.tag{font-size:15px;font-weight:700;letter-spacing:2px;fill:#536477}.title{font-size:30px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#455c73}.code{font-family:"DejaVu Sans Mono",monospace;font-size:21px}.note{font-size:20px;fill:#455c73}</style>
<rect width="1000" height="590" rx="18" fill="#f8fafc"/>
<rect x="0" y="0" width="8" height="590" rx="4" fill="#2864b4"/>
<text x="36" y="34" class="tag" text-anchor="start">RUST · СХЕМА</text>
<text x="36" y="77" class="title" text-anchor="start">Подготовка памяти перед main</text>
<text x="70" y="136" class="label" text-anchor="start">FLASH · сохраняет образ</text>
<text x="635" y="136" class="label" text-anchor="start">RAM · рабочие данные</text>
<rect x="40" y="160" width="350" height="130" rx="12" fill="#e8f1ff" stroke="#2864b4" stroke-width="2"/>
<text x="58" y="194" class="label" text-anchor="start" style="fill:#2864b4">.data в образе</text>
<text x="58" y="227" class="body" text-anchor="start">COUNTER: исходное 5</text>
<text x="58" y="256" class="body" text-anchor="start">адрес загрузки (LMA)</text>
<rect x="610" y="160" width="350" height="130" rx="12" fill="#e5f4ed" stroke="#287354" stroke-width="2"/>
<text x="628" y="194" class="label" text-anchor="start" style="fill:#287354">.data в работе</text>
<text x="628" y="227" class="body" text-anchor="start">COUNTER: 5 → 6 → …</text>
<text x="628" y="256" class="body" text-anchor="start">адрес выполнения (VMA)</text>
<path d="M 395 225 L 605 225" fill="none" stroke="#536477" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
<text x="500.0" y="213.0" class="small" text-anchor="middle">копирование</text>
<rect x="610" y="340" width="350" height="115" rx="12" fill="#e5f4ed" stroke="#287354" stroke-width="2"/>
<text x="628" y="374" class="label" text-anchor="start" style="fill:#287354">.bss в работе</text>
<text x="628" y="407" class="body" text-anchor="start">счётчик: 0</text>
<text x="628" y="436" class="body" text-anchor="start">заполнить нулями</text>
<text x="72" y="371" class="body" text-anchor="start">В образе не нужен</text>
<text x="72" y="400" class="body" text-anchor="start">блок нулевых байтов.</text>
<text x="477" y="400" class="label" text-anchor="middle">0</text>
<path d="M 495 395 L 605 395" fill="none" stroke="#536477" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
<text x="40" y="505" class="code" text-anchor="start">Reset → обнуление .bss → копирование .data → main</text>
<text x="36" y="553" class="note" text-anchor="start">Обычный код рассчитывает, что начальные значения уже подготовлены.</text>
</svg>
