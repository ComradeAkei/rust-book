[package]
name = "ch22-tasks"
version = "0.1.0"
description = "Глава 22, задача D1: две задачи без кучи — их будят SysTick и приём UART0, ядро спит в wfi"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ch22-solutions = { path = "../../solutions/ch22", default-features = false }
# singleton! берёт буфер арены под critical-section: на одном ядре это
# запрет прерываний.
cortex-m = { workspace = true, features = ["critical-section-single-core"] }
cortex-m-rt = { workspace = true }
cortex-m-semihosting = { workspace = true }

[[bin]]
name = "ch22-tasks"
test = false
bench = false
