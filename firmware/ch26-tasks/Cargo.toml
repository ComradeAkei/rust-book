[package]
name = "ch26-tasks"
version = "0.1.0"
description = "Глава 26, задача D: свои memcpy, memmove и memset вместо функций compiler_builtins"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Функции из раздела 26.5, в которых компилятор вставляет вызовы memcpy.
ch26 = { path = "../../code/ch26", default-features = false }
ch26-solutions = { path = "../../solutions/ch26", features = ["count"] }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
cortex-m-semihosting = { workspace = true }

[[bin]]
name = "ch26-tasks"
test = false
bench = false
