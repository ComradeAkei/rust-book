[package]
name = "ch25-flash"
version = "0.1.0"
description = "Глава 25: что вычислено при компиляции и сколько это стоит в ОЗУ — .data, .bss, таблицы во flash"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Та же таблица обратных, но в `static mut`: она переезжает в .data и
# занимает и flash (образ), и ОЗУ (копия), а код запуска копирует её.
ram-table = []

[dependencies]
ch25 = { path = "../../code/ch25", default-features = false }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
cortex-m-semihosting = { workspace = true }

[[bin]]
name = "ch25-flash"
test = false
bench = false
