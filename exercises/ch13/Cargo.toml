[package]
name = "ch13-exercises"
version = "0.1.0"
description = "Глава 13: заготовки задач A–D для студента"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Задачи B (решето простых) и D (аллокации collect) с кучей. Без этой
# возможности библиотека собирается в no_std для Cortex-M: остаются
# задачи A, C и итераторы по битам и по кадрам SLIP из задачи B.
std = ["alloc"]
alloc = []

[[test]]
name = "ch13"
path = "tests/ch13.rs"
