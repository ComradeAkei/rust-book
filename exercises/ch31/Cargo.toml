[package]
name = "ch31-exercises"
version = "0.1.0"
description = "Глава 31: заготовки задач A–D для студента — свойства и стратегии proptest, фаззинг парсеров глав 5 и 6, Kani на очереди главы 21, мутанты хранилища проекта и ошибка спецификации"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# proptest — в обычных зависимостях: стратегии задачи A — открытый API
# крейта, их зовут общие тесты.
[dependencies]
proptest = "1.12.0"

# Задача D: тесты хранилища проекта (tests/d_store.rs).
[dev-dependencies]
telemetry-frame = { path = "../../project/telemetry-frame" }
telemetry-store = { path = "../../project/telemetry-store" }

[[test]]
name = "ch31"
path = "tests/ch31.rs"

[[test]]
name = "d_store"
path = "tests/d_store.rs"

# Доказательства Kani (задачи C и D) собирает только cargo kani.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
