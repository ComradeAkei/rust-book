publish.workspace = true

[dependencies]
# Задача B строит конфигурацию на лексере из задачи 5.B: берём эталонный,
# чтобы задача не зависела от решения главы 5.
ch05-solutions = { path = "../../solutions/ch05" }

[[bin]]
name = "d_double"
test = false
bench = false

[[test]]
name = "ch07"
path = "tests/ch07.rs"
