[package]
name = "ch12-exercises"
version = "0.1.0"
description = "Глава 12: заготовки задач A–D для студента"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Задача D: потоки и Rc. Без этой возможности библиотека собирается в
# no_std, и задача A сверяет ответы на thumbv7m-none-eabi.
std = []
# Задача D: строки, которые делают замыкание и future не Send. Тест
# собирает с этой возможностью пробный крейт и ждёт ошибку в нём.
d-break = []
# Задача D: та же строка в make_job_send. Тест ждёт ошибку в самой
# библиотеке, у сигнатуры с `+ Send`.
d-break-send = []

[[test]]
name = "ch12"
path = "tests/ch12.rs"
