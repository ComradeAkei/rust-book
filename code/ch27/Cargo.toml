[package]
name = "ch27"
version = "0.1.0"
description = "Глава 27: Cortex-M на Rust — исключения и EXC_RETURN, приоритеты NVIC, bit-band, MPU, драйвер на embedded-hal 1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Крейт no_std: его разбирают тесты на хосте, а функции зовут прошивки
# firmware/ch27-* и HAL code/ch27-hal.
[dependencies]
embedded-hal = "1.0.0"

# Тест tests/station.rs собирает прошивку firmware/ch27-station, запускает
# её в QEMU и разбирает кадры из UART0 тем же крейтом, что и прошивка.
[dev-dependencies]
telemetry-frame = { path = "../../project/telemetry-frame" }
