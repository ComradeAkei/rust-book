[package]
name = "ch13"
version = "0.1.0"
description = "Глава 13: итераторы, IntoIterator и for, адаптеры и потребители, собственные итераторы, во что компилируется цепочка адаптеров"
edition.workspace = true
# Безопасные функции с #[target_feature] (раздел 13.5) стабильны с 1.86.
rust-version = "1.86"
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Примеры с HashMap, определение AVX2 во время работы и бенчмарк. Без этой
# возможности библиотека собирается в no_std для Cortex-M.
std = ["alloc"]
# Примеры с Vec, String и collect в коллекции. Прошивке, у которой нет
# распределителя памяти, они не нужны.
alloc = []

[[example]]
name = "bench"
path = "examples/bench.rs"
required-features = ["std"]
