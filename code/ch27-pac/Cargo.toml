# Раздел 27.3: крейт доступа к периферии (PAC) LM3S6965. src/lib.rs,
# build.rs и device.x сгенерированы svd2rust 0.37.1 из
# code/ch27/svd/lm3s6965.svd скриптом code/ch27/svd/gen-pac.sh — руками их
# не правят. Edition 2021, как ждёт сгенерированный код.
[package]
name = "ch27-pac"
version = "0.1.0"
description = "Глава 27: PAC LM3S6965 (SYSCTL, GPIO, UART, таймеры, АЦП), сгенерированный svd2rust"
edition = "2021"
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = { version = "0.7.5", optional = true }
critical-section = { version = "1.2.0", optional = true }
vcell = "0.1.3"

[features]
# Таблица векторов прерываний и атрибут #[interrupt] для cortex-m-rt.
rt = ["cortex-m-rt/device"]
# Peripherals::take() берёт флаг «уже выдано» под critical-section.
critical-section = ["dep:critical-section"]
