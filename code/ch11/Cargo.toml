[package]
name = "ch11"
version = "0.1.0"
description = "Глава 11: dyn Trait, толстые указатели, таблицы методов, Any, приведение к супертрейту и цена косвенного вызова"
edition.workspace = true
# Приведение к супертрейту (раздел 11.5) стабильно с 1.86.
rust-version = "1.86"
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Примеры с std. Без этой возможности библиотека собирается в no_std для
# Cortex-M.
std = ["alloc"]
# Примеры с Box, Rc и Vec. Прошивке, у которой нет распределителя памяти,
# они не нужны.
alloc = []
# Тест tests/nightly.rs: ptr::metadata и -Zretpoline. Только для
# `cargo +nightly test -p ch11 --features nightly --test nightly`.
nightly = []
