[package]
name = "ch14"
version = "0.1.0"
description = "Глава 14: Box, Deref, Rc и Weak, Arc, Cell и RefCell, ленивая инициализация, Cow"
edition.workspace = true
# Box::new_zeroed (раздел 14.1) стабилен с 1.92.
rust-version = "1.92"
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Потоки, OnceLock и LazyLock, бенчмарк. Без этой возможности библиотека
# собирается в no_std для Cortex-M.
std = ["alloc"]
# Box, Rc, Arc и Cow. Без кучи остаются ячейки Cell, RefCell, OnceCell и
# LazyCell.
alloc = []

[[example]]
name = "bench"
path = "examples/bench.rs"
required-features = ["std"]

[[example]]
name = "bigbox"
path = "examples/bigbox.rs"
required-features = ["std"]

[[example]]
name = "sneaky"
path = "examples/sneaky.rs"
required-features = ["std"]

[dev-dependencies]
# Таблица CRC из раздела 14.6 сверяется с побитовой CRC проекта.
telemetry-frame = { path = "../../project/telemetry-frame" }
