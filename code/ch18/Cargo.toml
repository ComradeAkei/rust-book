[package]
name = "ch18"
version = "0.1.0"
description = "Глава 18: FFI с C — extern, repr(C), строки, владение через границу, обратные вызовы, zlib"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Крейт хостовый: линкуется с C (наш c/support.c, libc, zlib). Под Miri и
# под Cortex-M не идёт. staticlib нужен, чтобы C-программа из c/run.sh могла
# слинковаться с экспортированными в C функциями (раздел 18.4).
[lib]
crate-type = ["lib", "staticlib"]
