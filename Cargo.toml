# Заготовки задач не компилируются в рабочее состояние, пока студент их не решит,
# поэтому `cargo test` в корне проверяет примеры глав и эталонные решения.
default-members = [
    "code/ch00",
    "code/ch01",
    "code/ch02",
    "code/ch03",
    "code/ch04",
    "code/ch05",
    "code/ch06",
    "code/ch06-regs",
    "code/ch07",
    "code/ch08",
    "code/ch09",
    "code/ch10",
    "code/ch11",
    "code/ch12",
    "code/ch13",
    "code/ch14",
    "code/ch15",
    "code/ch16",
    "code/appendix-a",
    "code/appendix-b",
    "code/appendix-b-2021",
    "code/appendix-c",
    "project/telemetry-frame",
    "project/telemetry-store",
    "solutions/ch00",
    "solutions/ch01",
    "solutions/ch02",
    "solutions/ch02-2021",
    "solutions/ch03",
    "solutions/ch04",
    "solutions/ch05",
    "solutions/ch06",
    "solutions/ch07",
    "solutions/ch08",
    "solutions/ch09",
    "solutions/ch10",
    "solutions/ch11",
    "solutions/ch12",
    "solutions/ch13",
    "solutions/ch14",
    "solutions/ch15",
    "solutions/ch16",
]
# Прошивки собираются под thumbv7m-none-eabi и живут в отдельном workspace.
exclude = ["firmware"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
debug = true

# Перебор в задаче 1.B2 проходит больше миллиарда чисел: без оптимизации тест
# идёт около двадцати секунд, с ней — секунду. Проверки переполнения и
# debug_assertions в dev остаются включёнными, от этого зависит задача 1.C.
[profile.dev.package.ch01-exercises]
opt-level = 3

[profile.dev.package.ch01-solutions]
opt-level = 3
