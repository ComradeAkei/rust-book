[workspace]
resolver = "3"
members = [
    "code/ch00",
    "code/ch01",
    "code/ch02",
    "code/ch06",
    "code/ch06-regs",
    "code/appendix-a",
    "code/appendix-b",
    "code/appendix-b-2021",
    "code/appendix-c",
    "exercises/ch00",
    "exercises/ch01",
    "exercises/ch02",
    "exercises/ch02-2021",
    "exercises/ch06",
    "exercises/project-frame",
    "project/telemetry-frame",
    "solutions/ch00",
    "solutions/ch01",
    "solutions/ch02",
    "solutions/ch02-2021",
    "solutions/ch06",
]
# Заготовки задач не компилируются в рабочее состояние, пока студент их не решит,
# поэтому `cargo test` в корне проверяет примеры глав и эталонные решения.
default-members = [
    "code/ch00",
    "code/ch01",
    "code/ch02",
    "code/ch06",
    "code/ch06-regs",
    "code/appendix-a",
    "code/appendix-b",
    "code/appendix-b-2021",
    "code/appendix-c",
    "project/telemetry-frame",
    "solutions/ch00",
    "solutions/ch01",
    "solutions/ch02",
    "solutions/ch02-2021",
    "solutions/ch06",
]
# Прошивки собираются под thumbv7m-none-eabi и живут в отдельном workspace.
exclude = ["firmware"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
debug = true

# Перебор в задаче 1.B2 проходит больше миллиарда чисел: без оптимизации тест
# идёт около двадцати секунд, с ней — секунду. Проверки переполнения и
# debug_assertions в dev остаются включёнными, от этого зависит задача 1.C.
[profile.dev.package.ch01-exercises]
opt-level = 3

[profile.dev.package.ch01-solutions]
opt-level = 3
