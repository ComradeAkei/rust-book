[package]
name = "ch18-solutions"
version = "0.1.0"
description = "Глава 18: эталонные решения задач A–D"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# staticlib: C-драйвер из c/run.sh линкуется с кольцевым буфером (задача C).
[lib]
crate-type = ["lib", "staticlib"]

[[test]]
name = "ch18"
path = "tests/ch18.rs"
