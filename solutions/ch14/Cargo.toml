[package]
name = "ch14-solutions"
version = "0.1.0"
description = "Глава 14: эталонные решения задач A–D"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Задача D (потоки). Без этой возможности библиотека собирается в no_std
# для Cortex-M с кучей: остаются задачи A, B и C.
std = []

[[test]]
name = "ch14"
path = "tests/ch14.rs"

[[example]]
name = "lists"
path = "examples/lists.rs"
required-features = ["std"]

[[example]]
name = "arc_threads"
path = "examples/arc_threads.rs"
required-features = ["std"]
