# Задача 0.B, часть 1: профиль release, который уменьшает hello с 4,3 МБ
# (профиль книги с debug = true) до 288 КБ на stable. Вклад каждого ключа
# измерен в приложении E.

# ANCHOR: tiny
[profile.release]
debug = false        # отладочная информация: основная масса файла
strip = true         # таблица символов и остатки отладочных секций
opt-level = "z"      # оптимизация по размеру, а не по скорости
lto = true           # оптимизация всей программы вместе с std
codegen-units = 1    # одна единица кодогенерации: меньше дублей
panic = "abort"      # без таблиц раскрутки и кода печати бэктрейса
# ANCHOR_END: tiny
