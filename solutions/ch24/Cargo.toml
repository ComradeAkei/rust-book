[package]
name = "ch24-solutions"
version = "0.1.0"
description = "Глава 24: эталонные решения задач A–D"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Без std библиотека собирается для Cortex-M: её использует прошивка
# firmware/ch24-tasks.
std = []

# Макросы подключены под общим для заготовок и решений именем tasks_macros:
# так один и тот же код тестов и снимков trybuild годится для обоих крейтов.
[dependencies]
tasks_macros = { package = "ch24-solutions-macros", path = "../ch24-macros" }

[dev-dependencies]
trybuild = "1.0.119"

[[test]]
name = "ch24"
path = "tests/ch24.rs"

[[test]]
name = "ui"
path = "tests/ui.rs"
